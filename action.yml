name: 'mcp-slim audit'
description: 'Audit MCP server configs for token bloat and security risks, and gate CI on the findings.'
author: 'Sandip Gami'
branding:
  icon: 'shield'
  color: 'purple'

inputs:
  config:
    description: 'Path to an MCP config file to audit. Defaults to auto-discovery on the runner.'
    required: false
    default: ''
  fail-on:
    description: 'Fail the job when a finding at or above this severity exists: none | low | medium | high.'
    required: false
    default: 'high'
  version:
    description: 'Version or dist-tag of @stackgauge/mcp-slim to run.'
    required: false
    default: 'latest'
  args:
    description: 'Extra arguments passed to `mcp-slim audit`.'
    required: false
    default: ''

outputs:
  grade:
    description: 'Overall security grade (A–F) across the audited configs.'
    value: ${{ steps.audit.outputs.grade }}
  score:
    description: 'Overall security score (0–100).'
    value: ${{ steps.audit.outputs.score }}

runs:
  using: 'composite'
  steps:
    - name: Audit MCP config
      id: audit
      shell: bash
      # Inputs are passed via env (not interpolated into the script) to avoid injection.
      env:
        INPUT_CONFIG: ${{ inputs.config }}
        INPUT_FAIL_ON: ${{ inputs.fail-on }}
        INPUT_VERSION: ${{ inputs.version }}
        INPUT_ARGS: ${{ inputs.args }}
      run: |
        set -uo pipefail
        config_arg=()
        if [ -n "$INPUT_CONFIG" ]; then config_arg=(--config "$INPUT_CONFIG"); fi
        pkg="@stackgauge/mcp-slim@${INPUT_VERSION}"

        # Human-readable report in the job log; captures the pass/fail gate.
        npx -y "$pkg" audit "${config_arg[@]}" --fail-on "$INPUT_FAIL_ON" --no-history $INPUT_ARGS
        gate=$?

        # Machine-readable pass -> PR Checks summary + grade/score outputs.
        json="$(npx -y "$pkg" audit "${config_arg[@]}" --json --no-history $INPUT_ARGS || true)"
        printf '%s' "$json" | node "$GITHUB_ACTION_PATH/scripts/summary.js"

        exit $gate
